name: Verify live website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS and redirects
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://guoqingwang1.github.io' }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import build_opener, HTTPRedirectHandler

          base = os.environ['SITE_URL'].rstrip('/') + '/'
          host = urlparse(base).hostname
          assert base.startswith('https://')
          class Trace(HTTPRedirectHandler):
              def __init__(self): self.chain = []
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.chain.append({'status': code, 'from': req.full_url, 'to': newurl})
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          def fetch(url):
              handler = Trace()
              with build_opener(handler).open(url, timeout=30) as response:
                  body = response.read()
                  assert response.status == 200 and response.url.startswith(base), (url, response.url)
                  return {'url': url, 'status': response.status, 'final_url': response.url,
                          'bytes': len(body), 'redirects': handler.chain, 'body': body}
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang = None; self.canonical = None
                  self.switches = []; self.alternates = {}; self.assets = []; self.refresh = None
                  self.ids = set(); self.news = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get('id'): self.ids.add(a['id'])
                  if 'news-item' in a.get('class', '').split(): self.news += 1
                  if tag == 'html': self.lang = a.get('lang')
                  if tag == 'a' and 'language-switch' in a.get('class', '').split(): self.switches.append(a['href'])
                  if tag == 'meta' and a.get('http-equiv', '').lower() == 'refresh': self.refresh = a['content']
                  if tag == 'link':
                      if a.get('rel') == 'canonical': self.canonical = a['href']
                      if a.get('hreflang'): self.alternates[a['hreflang']] = a['href']
                      if a.get('rel') in ('stylesheet', 'icon'): self.assets.append(a['href'])
          paths = ['', 'publications/', 'blog/', 'zh/blog/', 'rss.xml', 'zh/rss.xml', 'en/rss.xml', 'sitemap.xml',
                   'en/', 'en/publications/', 'en/blog/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(fetch, [base+path for path in paths]))
          by_path = dict(zip(paths, results))
          assets = set()
          for path, lang in [('', 'en'), ('publications/', 'en'), ('blog/', 'en'), ('zh/blog/', 'zh-CN')]:
              parser = Page(); parser.feed(by_path[path]['body'].decode())
              assert parser.lang == lang and parser.canonical == base+path, path
              if path in ('blog/', 'zh/blog/'):
                  assert parser.switches == (['/zh/blog/'] if lang == 'en' else ['/blog/'])
                  assert parser.alternates == {'en':base+'blog/', 'zh-CN':base+'zh/blog/', 'x-default':base+'blog/'}
              else:
                  assert not parser.switches and not parser.alternates, path
              if path == '':
                  assert parser.news == 3 and 'news' in parser.ids
                  assert b'Guoqing Wang' in by_path[path]['body'] and b'D6vayD4AAAAJ' in by_path[path]['body']
              assets.update(parser.assets)
          for path, target in [('en/', ''), ('en/publications/', 'publications/'), ('en/blog/', 'blog/')]:
              parser = Page(); parser.feed(by_path[path]['body'].decode())
              assert parser.canonical == base+target and parser.refresh == '0;url=/'+target, path
          for path, lang in [('rss.xml','en'), ('zh/rss.xml','zh-CN'), ('en/rss.xml','en')]:
              assert ('<language>'+lang+'</language>') in by_path[path]['body'].decode()
          assert b'/en/' not in by_path['sitemap.xml']['body']
          for asset in sorted(assets):
              url = urljoin(base, asset); assert urlparse(url).hostname == host
              results.append(fetch(url))
          results.append(fetch('http://'+host+'/'))
          if not host.endswith('.github.io'): results.append(fetch('https://www.'+host+'/'))
          summary = [{k:v for k,v in result.items() if k != 'body'} for result in results]
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write('## Live website verified\n\nEnglish main pages, bilingual Blog, News, legacy aliases, RSS, assets and HTTPS passed.\n\n')
              f.write('```json\n'+json.dumps(summary, indent=2)+'\n```\n')
          PY
