name: Verify live website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the expected public content
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify public HTTPS and redirects
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://guoqingwang1.github.io' }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, re, struct
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          from urllib.parse import unquote, urljoin, urlparse
          from urllib.request import build_opener, HTTPRedirectHandler
          from xml.etree import ElementTree as ET

          base = os.environ['SITE_URL'].rstrip('/') + '/'
          host = urlparse(base).hostname
          with open('src/data/news.json') as source:
              expected_news = json.load(source)
          with open('src/data/publications.json') as source:
              expected_publications = json.load(source)
          with open('src/data/publication-contributions.json') as source:
              expected_contributions = json.load(source)
          with open('src/data/related-posts.json') as source:
              related_post_keys = json.load(source)
          with open('src/data/example-assets.json') as source:
              example_assets = json.load(source)
          with open('src/data/share-images.json') as source:
              share_images = json.load(source)
          assert base.startswith('https://')
          class Trace(HTTPRedirectHandler):
              def __init__(self): self.chain = []
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.chain.append({'status': code, 'from': req.full_url, 'to': newurl})
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          def fetch(url):
              handler = Trace()
              with build_opener(handler).open(url, timeout=30) as response:
                  body = response.read()
                  assert response.status == 200 and response.url.startswith(base), (url, response.url)
                  return {'url': url, 'status': response.status, 'final_url': response.url,
                          'bytes': len(body), 'content_type': response.headers.get_content_type(),
                          'sha256': hashlib.sha256(body).hexdigest(),
                          'redirects': handler.chain, 'body': body}
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang = None; self.canonical = None
                  self.switches = []; self.alternates = []; self.assets = []; self.refresh = None
                  self.ids = set(); self.news = 0; self.paper_languages = []
                  self.header_lang = None; self.header_switches = []; self.header_anchors = []; self.navigation = []
                  self.in_header = False; self.in_navigation = False; self.anchor = None
                  self.meta_properties = {}; self.meta_names = {}
                  self.links = []; self.rss_links = []
                  self.article_key = None; self.h2_ids = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'article' and a.get('data-translation-key'): self.article_key = a['data-translation-key']
                  if tag == 'h2' and a.get('id'): self.h2_ids.append(a['id'])
                  if a.get('id'): self.ids.add(a['id'])
                  if 'news-item' in a.get('class', '').split(): self.news += 1
                  if tag == 'article' and 'publication' in a.get('class', '').split(): self.paper_languages.append(a.get('lang'))
                  if tag == 'html': self.lang = a.get('lang')
                  if tag == 'script' and a.get('src'): self.assets.append(a['src'])
                  if tag == 'header' and 'site-header' in a.get('class', '').split():
                      self.in_header = True; self.header_lang = a.get('lang')
                  if tag == 'nav' and self.in_header and a.get('id') == 'main-navigation': self.in_navigation = True
                  if tag == 'a':
                      self.links.append(a)
                      if 'language-switch' in a.get('class', '').split():
                          self.switches.append(a)
                          if self.in_header: self.header_switches.append(a)
                      if self.in_header: self.anchor = {'attrs': a, 'text': [], 'navigation': self.in_navigation}
                  if tag == 'meta':
                      if a.get('http-equiv', '').lower() == 'refresh': self.refresh = a['content']
                      if a.get('property'): self.meta_properties.setdefault(a['property'], []).append(a.get('content'))
                      if a.get('name'): self.meta_names.setdefault(a['name'], []).append(a.get('content'))
                  if tag == 'link':
                      if a.get('rel') == 'canonical': self.canonical = a['href']
                      if a.get('rel') == 'alternate' and a.get('hreflang'): self.alternates.append((a['hreflang'], a['href']))
                      if a.get('rel') in ('stylesheet', 'icon'): self.assets.append(a['href'])
                      if a.get('rel') == 'alternate' and a.get('type') == 'application/rss+xml': self.rss_links.append(a['href'])
              def handle_data(self, data):
                  if self.anchor is not None: self.anchor['text'].append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.anchor is not None:
                      anchor = {**self.anchor['attrs'], 'text': ''.join(self.anchor['text']).strip()}
                      self.header_anchors.append(anchor)
                      if self.anchor['navigation']: self.navigation.append((anchor['text'], anchor.get('href')))
                      self.anchor = None
                  if tag == 'nav': self.in_navigation = False
                  if tag == 'header': self.in_header = False
          def verify_share_metadata(page, lang, path):
              image = share_images[lang]
              image_url = urljoin(base, image['path'])
              assert image_url.startswith(base) and image_url.startswith('https://'), path
              expected = {'og:url':page.canonical, 'og:image':image_url, 'og:image:secure_url':image_url,
                          'og:image:type':image['type'], 'og:image:width':str(image['width']),
                          'og:image:height':str(image['height']), 'og:image:alt':image['alt']}
              for key, value in expected.items():
                  assert page.meta_properties.get(key) == [value], (path, key)
              for key in ('og:title', 'og:type'):
                  values = page.meta_properties.get(key, [])
                  assert len(values) == 1 and values[0], (path, key)
              for key, value in {'twitter:card':'summary_large_image', 'twitter:image':image_url, 'twitter:image:alt':image['alt']}.items():
                  assert page.meta_names.get(key) == [value], (path, key)
          def image_info(body):
              if len(body) >= 33 and body[:8] == b'\x89PNG\r\n\x1a\n':
                  assert body[8:16] == b'\x00\x00\x00\rIHDR', 'Invalid PNG IHDR'
                  return ('image/png', *struct.unpack('>II', body[16:24]))
              if len(body) >= 4 and body[:2] == b'\xff\xd8':
                  offset = 2
                  while offset < len(body):
                      assert body[offset] == 0xff, 'Invalid JPEG marker'
                      while offset < len(body) and body[offset] == 0xff: offset += 1
                      assert offset < len(body), 'Truncated JPEG marker'
                      marker = body[offset]; offset += 1
                      if marker in (0xda, 0xd9): break
                      if marker == 0x01 or 0xd0 <= marker <= 0xd7: continue
                      assert offset + 2 <= len(body), 'Truncated JPEG segment'
                      length = int.from_bytes(body[offset:offset+2], 'big')
                      assert length >= 2 and offset + length <= len(body), 'Invalid JPEG segment length'
                      if marker in (0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf):
                          assert length >= 8, 'Truncated JPEG frame header'
                          height, width = struct.unpack('>HH', body[offset+3:offset+7])
                          return ('image/jpeg', width, height)
                      offset += length
              raise AssertionError('Share image is not a readable PNG/JPEG header')
          paths = ['', 'publications/', 'blog/', 'zh/', 'zh/publications/', 'zh/blog/', 'rss.xml', 'zh/rss.xml', 'en/rss.xml', 'sitemap.xml',
                   'en/', 'en/publications/', 'en/blog/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(fetch, [base+path for path in paths]))
          by_path = dict(zip(paths, results))
          sitemap_urls = [node.text for node in ET.fromstring(by_path['sitemap.xml']['body']).findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert all(url and url.startswith(base) for url in sitemap_urls), 'Sitemap contains a non-site URL'
          article_paths = [url[len(base):] for url in sitemap_urls if re.fullmatch(r'(?:zh/)?blog/[a-z0-9]+(?:-[a-z0-9]+)*/', url[len(base):])]
          assert len(article_paths) == len(set(article_paths)), 'Duplicate sitemap article URLs'
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              article_results = list(pool.map(fetch, [base+path for path in article_paths]))
          by_path.update(zip(article_paths, article_results))
          results.extend(article_results)
          feed_items = {}
          for path in ('rss.xml', 'zh/rss.xml', 'en/rss.xml'):
              feed_items[path] = ET.fromstring(by_path[path]['body']).findall('./channel/item')
          feed_links = {path:[item.findtext('link') for item in items] for path,items in feed_items.items()}
          assets = set()
          translation_pairs = [('', 'zh/'), ('publications/', 'zh/publications/'), ('blog/', 'zh/blog/')]
          for en_path, zh_path in translation_pairs:
              for path, lang, other_path in [(en_path, 'en', zh_path), (zh_path, 'zh-CN', en_path)]:
                  parser = Page(); parser.feed(by_path[path]['body'].decode())
                  assert parser.lang == lang and parser.header_lang == lang and parser.canonical == base+path, path
                  verify_share_metadata(parser, lang, path)
                  assert len(parser.switches) == 1 and len(parser.header_switches) == 1, path
                  switch = parser.switches[0]
                  assert switch['href'] == '/'+other_path, path
                  other_lang = 'zh-CN' if lang == 'en' else 'en'
                  assert switch.get('lang') == other_lang and switch.get('hreflang') == other_lang, path
                  assert switch.get('title') and switch.get('aria-label'), path
                  switch_anchor = [a for a in parser.header_anchors if 'language-switch' in a.get('class', '').split()]
                  assert len(switch_anchor) == 1 and switch_anchor[0]['text'] == ('中文' if lang == 'en' else 'EN'), path
                  assert len(parser.alternates) == 3 and dict(parser.alternates) == {'en':base+en_path, 'zh-CN':base+zh_path, 'x-default':base+en_path}, path
                  home = '/zh/' if lang == 'zh-CN' else '/'
                  labels = ['关于', '论文', '博客'] if lang == 'zh-CN' else ['About', 'Publications', 'Blog']
                  assert parser.navigation == list(zip(labels, [home, home+'publications/', home+'blog/'])), path
                  brands = [a for a in parser.header_anchors if 'site-name' in a.get('class', '').split()]
                  assert len(brands) == 1 and brands[0]['href'] == home, path
                  social = [a for a in parser.header_anchors if a.get('href', '').startswith(('https://', 'http://', 'mailto:'))]
                  assert len(social) == 3, path
                  assert any(a.get('href') == 'https://github.com/GuoqingWang1' and a.get('aria-label') == 'GitHub' for a in social), path
                  assert any('scholar.google.com/citations?' in a.get('href', '') and 'user=D6vayD4AAAAJ' in a['href'] and a.get('aria-label') == ('谷歌学术' if lang == 'zh-CN' else 'Google Scholar') for a in social), path
                  assert any(a.get('href') == 'mailto:guoqingwang905@gmail.com' and a.get('aria-label') == ('邮箱' if lang == 'zh-CN' else 'Email')+': guoqingwang905@gmail.com' for a in social), path
                  if en_path == '':
                      assert parser.news == len(expected_news) and 'news' in parser.ids, path
                      assert b'Guoqing Wang' in by_path[path]['body'] and b'D6vayD4AAAAJ' in by_path[path]['body']
                  if en_path in ('', 'publications/'):
                      count = len(expected_publications['selected'] if en_path == '' else expected_publications['papers'])
                      assert parser.paper_languages == ['en'] * count, path
                  assets.update(parser.assets)
          for path in article_paths:
              result = by_path[path]
              assert result['final_url'] == base+path and not result['redirects'], path
              parser = Page(); parser.feed(result['body'].decode())
              lang = 'zh-CN' if path.startswith('zh/') else 'en'
              home = '/zh/' if lang == 'zh-CN' else '/'
              other_article = path[3:] if lang == 'zh-CN' else 'zh/'+path
              en_article = path[3:] if lang == 'zh-CN' else path
              other_lang = 'en' if lang == 'zh-CN' else 'zh-CN'
              other_label = 'Read this article in English' if lang == 'zh-CN' else '阅读本文中文版'
              assert parser.lang == lang and parser.header_lang == lang and parser.canonical == base+path, path
              verify_share_metadata(parser, lang, path)
              assert parser.meta_properties.get('og:type') == ['article'], path
              assert other_article in article_paths, 'Missing translated article: '+path
              assert len(parser.alternates) == 3 and dict(parser.alternates) == {'en':base+en_article,'zh-CN':base+'zh/'+en_article,'x-default':base+en_article}, path
              assert len(parser.switches) == 1 and len(parser.header_switches) == 1, path
              switch = parser.switches[0]
              assert switch.get('href') == '/'+other_article and not urlparse(switch['href']).fragment, path
              assert switch.get('lang') == other_lang and switch.get('hreflang') == other_lang, path
              assert switch.get('title') == other_label and switch.get('aria-label') == other_label, path
              assert 'data-article-translation' in switch, path
              translation = Page(); translation.feed(by_path[other_article]['body'].decode())
              assert parser.article_key and parser.article_key == translation.article_key, path
              mapping = json.loads(switch['data-anchor-map'])
              assert list(mapping) == parser.h2_ids and list(mapping.values()) == translation.h2_ids, path
              switch_anchor = [a for a in parser.header_anchors if 'language-switch' in a.get('class', '').split()]
              assert len(switch_anchor) == 1 and switch_anchor[0]['text'] == ('EN' if lang == 'zh-CN' else '中文'), path
              labels = ['关于', '论文', '博客'] if lang == 'zh-CN' else ['About', 'Publications', 'Blog']
              assert parser.navigation == list(zip(labels, [home, home+'publications/', home+'blog/'])), path
              brands = [a for a in parser.header_anchors if 'site-name' in a.get('class', '').split()]
              assert len(brands) == 1 and brands[0]['href'] == home, path
              assert parser.rss_links == [home+'rss.xml'], path
              back = [a for a in parser.links if 'article-back' in a.get('class', '').split()]
              assert len(back) == 1 and back[0].get('href') == home+'blog/', path
              related = [a for a in parser.links if a.get('data-related-key')]
              expected_related = related_post_keys[parser.article_key]
              assert 1 <= len(related) <= 2 and [a['data-related-key'] for a in related] == expected_related, path
              assert [a['href'] for a in related] == [home+'blog/'+key+'/' for key in expected_related], path
              assert all(a.get('lang') == lang for a in related), path
              for anchor in parser.links:
                  href = anchor.get('href', '')
                  if href.startswith('#') and len(href) > 1: assert unquote(href[1:]) in parser.ids, (path, href)
              feed_path = 'zh/rss.xml' if lang == 'zh-CN' else 'rss.xml'
              matching_items = [item for item in feed_items[feed_path] if item.findtext('link') == base+path]
              assert len(matching_items) == 1, 'Article missing or duplicated in own-language RSS: '+path
              published = parser.meta_properties.get('article:published_time', [])
              assert len(published) == 1 and published[0], path
              og_date = datetime.datetime.fromisoformat(published[0].replace('Z', '+00:00'))
              rss_date = parsedate_to_datetime(matching_items[0].findtext('pubDate'))
              assert og_date.tzinfo is not None and rss_date.tzinfo is not None and int(og_date.timestamp()) == int(rss_date.timestamp()), 'Article/RSS publication instant mismatch: '+path
              assets.update(parser.assets)
          catalogs = []
          for lang, list_path, feed_path in [('en','blog/','rss.xml'), ('zh-CN','zh/blog/','zh/rss.xml')]:
              expected = {base+path for path in article_paths if path.startswith('zh/') == (lang == 'zh-CN')}
              parser = Page(); parser.feed(by_path[list_path]['body'].decode())
              catalogs.append([a.get('data-post-key') for a in parser.links if 'blog-entry' in a.get('class','').split()])
              listed = [urljoin(base, a['href']) for a in parser.links if 'blog-entry' in a.get('class', '').split()]
              assert len(listed) == len(set(listed)) and set(listed) == expected, 'Blog list/sitemap language mismatch: '+list_path
              assert len(feed_links[feed_path]) == len(set(feed_links[feed_path])) and set(feed_links[feed_path]) == expected, 'RSS/sitemap language mismatch: '+feed_path
          assert catalogs[0] == catalogs[1] and all(catalogs[0]), 'Blog languages must show the same article catalog'
          assert feed_links['en/rss.xml'] == feed_links['rss.xml'], 'Legacy English RSS entries differ'
          def paper_markup(body):
              entries = []
              for match in re.finditer(r'<article\b([^>]*)>[\s\S]*?</article>', body.decode()):
                  classes = re.search(r'\bclass="([^"]*)"', match[1])
                  if classes and 'publication' in classes[1].split():
                      entries.append(re.sub(r'<p\b[^>]*class="pub-contribution"[^>]*>[\s\S]*?</p>', '', match[0]))
              return entries
          for en_path, zh_path in translation_pairs[:2]:
              assert paper_markup(by_path[en_path]['body']) == paper_markup(by_path[zh_path]['body']), 'Publication records/order differ across languages: '+en_path
          for home, lang in [('', 'en'), ('zh/', 'zh-CN')]:
              body = by_path[home]['body'].decode()
              summaries = re.findall(r'<p\b[^>]*class="pub-contribution"[^>]*lang="'+lang+r'"[^>]*>([^<]+)</p>', body)
              assert summaries == [expected_contributions[key][lang] for key in expected_publications['selected']], 'Wrong localized homepage contributions: '+home
              assert 'pub-contribution' not in by_path[home+'publications/']['body'].decode(), 'Homepage summaries leaked into Publications'
          for path, target in [('en/', ''), ('en/publications/', 'publications/'), ('en/blog/', 'blog/')]:
              parser = Page(); parser.feed(by_path[path]['body'].decode())
              assert parser.canonical == base+target and parser.refresh == '0;url=/'+target, path
              assert parser.lang == 'en' and not parser.switches and not parser.alternates, path
          for path, lang in [('rss.xml','en'), ('zh/rss.xml','zh-CN'), ('en/rss.xml','en')]:
              assert ('<language>'+lang+'</language>') in by_path[path]['body'].decode()
          assert b'/en/' not in by_path['sitemap.xml']['body']
          for en_path, zh_path in translation_pairs:
              for path in (en_path, zh_path): assert ('<loc>'+base+path+'</loc>').encode() in by_path['sitemap.xml']['body'], path
          for asset in sorted(assets):
              url = urljoin(base, asset); assert urlparse(url).hostname == host
              results.append(fetch(url))
          assert set(share_images) == {'en', 'zh-CN'}
          image_urls = {}
          for lang, image in share_images.items():
              assert re.fullmatch(r'/social/[a-zA-Z0-9][a-zA-Z0-9._-]*\.(?:png|jpe?g)', image['path']), lang
              assert image['type'] in ('image/png', 'image/jpeg') and (image['width'], image['height']) == (1200, 630), lang
              image_urls[urljoin(base, image['path'])] = image
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              image_results = list(pool.map(fetch, image_urls))
          for result in image_results:
              image = image_urls[result['url']]
              assert result['final_url'] == result['url'] and not result['redirects'], result['url']
              assert result['content_type'] == image['type'], result['url']
              assert result['bytes'] < 5_000_000, 'Share image exceeds project compatibility target'
              assert image_info(result['body']) == (image['type'], image['width'], image['height']), result['url']
              digest = hashlib.sha256(result['body']).hexdigest()
              assert digest == image['sha256'], 'Live share-image content differs from manifest'
              result.update({'sha256':digest, 'width':image['width'], 'height':image['height'], 'anonymous_image_access':True})
              results.append(result)
          for asset in example_assets:
              assert re.fullmatch(r'/examples/[a-zA-Z0-9][a-zA-Z0-9._-]*', asset['path'])
              result = fetch(urljoin(base, asset['path']))
              assert result['final_url'] == result['url'] and not result['redirects']
              assert result['sha256'] == asset['sha256'], 'Example asset differs from verified source: '+asset['path']
              results.append(result)
          results.append(fetch('http://'+host+'/'))
          if not host.endswith('.github.io'): results.append(fetch('https://www.'+host+'/'))
          summary = [{k:v for k,v in result.items() if k != 'body'} for result in results]
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write('## Live website verified\n\nSix bilingual pages, '+str(len(article_paths))+' published articles, localized header navigation and switches, identical English publication records, News, legacy aliases, language-isolated Blog/RSS links, share metadata and anonymous PNG/JPEG card assets, and HTTPS passed.\n\n')
              f.write('```json\n'+json.dumps(summary, indent=2)+'\n```\n')
          PY
