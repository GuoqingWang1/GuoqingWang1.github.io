name: Deploy GitHub Pages

# Public releases remain manual until the reviewed site is approved.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://guoqingwang1.github.io' }}

jobs:
  build:
    if: github.repository == 'GuoqingWang1/GuoqingWang1.github.io' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify content publication rules
        run: npm run test:content
      - name: Build static site
        run: npm run build
      - name: Verify generated site
        run: npm run verify
      - name: Upload static output
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
